<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The tile is the app's own default ink (#1b1b1f) and the nib and ink are its
       default page colour, so the icon reads as the same thing the window shows. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1b1b1f"/>

  <!-- The mark the nib leaves, trailing behind the tip. -->
  <path d="M24 106 C34 96 44 110 60 98" fill="none" stroke="#fbfbfd" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Barrel, then the tapered nib converging on the tip. -->
  <path d="M106.4 30.4 L72.3 64.5 L59.5 51.7 L93.6 17.6 Z" fill="#fbfbfd"/>
  <path d="M72.3 64.5 L38 86 L59.5 51.7 Z" fill="#c9ccd6"/>
  <!-- A gap between barrel and nib so they do not read as one long triangle. -->
  <path d="M59.5 51.7 L72.3 64.5" fill="none" stroke="#1b1b1f" stroke-width="5"/>
</svg>